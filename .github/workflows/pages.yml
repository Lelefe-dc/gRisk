name: Deploy Guardrisk demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild static demo
        shell: bash
        run: |
          mkdir -p _site
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path('site.html.gz.b64').read_text().strip()
          html = gzip.decompress(base64.b64decode(payload))
          Path('_site/index.html').write_bytes(html)
          Path('_site/.nojekyll').touch()
          print(f'Built Guardrisk demo: {len(html)} bytes')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
